name: CI

on:
  # Pushes to main are checked by publish-image.yml, which calls this workflow
  # before building, so main isn't listed here (avoids running CI twice).
  push:
    branches: [dev, 'claude/**']
  pull_request:
    branches: [main, dev]
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # CQ-07: fail if code isn't Prettier-formatted (src/ + server/ normalized).
      - name: Format check
        run: npm run format:check

      - name: Test (with coverage thresholds)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # Blocking as of DEP-05 (tree is clean at high severity). A newly
      # disclosed high/critical advisory will fail CI until triaged.
      - name: Audit dependencies
        run: npm audit --audit-level=high
