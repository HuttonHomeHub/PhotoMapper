name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Advisory until DEP-05 applies `npm audit fix`. Once the known
      # vulnerabilities are cleared this becomes a blocking gate (remove
      # continue-on-error and raise as appropriate).
      - name: Audit dependencies (advisory)
        run: npm audit --audit-level=high
        continue-on-error: true
