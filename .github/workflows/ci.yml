name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # CQ-07: fail if code isn't Prettier-formatted (src/ + server/ normalized).
      - name: Format check
        run: npm run format:check

      - name: Test (with coverage thresholds)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # Blocking as of DEP-05 (tree is clean at high severity). A newly
      # disclosed high/critical advisory will fail CI until triaged.
      - name: Audit dependencies
        run: npm audit --audit-level=high
