name: CI

on:
  # Pushes to main are checked by publish-image.yml, which calls this workflow
  # before building, so main isn't listed here (avoids running CI twice).
  push:
    branches: [dev, 'claude/**']
  pull_request:
    branches: [main, dev]
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Exactly what `npm run check` runs locally: the vendored-platform check, typecheck,
      # lint, format check, tests with coverage thresholds, build, and npm audit (high).
      - name: Run checks
        run: npm run check
